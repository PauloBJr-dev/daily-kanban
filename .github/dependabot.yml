version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'UTC'
    commit-message:
      prefix: 'ci(deps)'
      include: 'scope'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'ci'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'UTC'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
      include: 'scope'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      linters-formatters:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - '@typescript-eslint/*'
      test-frameworks:
        patterns:
          - 'vitest*'
          - '@testing-library/*'
