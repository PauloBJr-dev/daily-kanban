name: '🐛 Bug Report'
description: 'File a report to help us reproduce and fix an issue'
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please check existing issues first.

  - type: textarea
    id: bug-description
    attributes:
      label: 'Bug Description'
      description: 'A clear and concise description of what the bug is.'
      placeholder: 'When doing X, Y occurs instead of Z...'
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 'Steps to Reproduce'
      description: 'Step-by-step instructions to reproduce the issue.'
      value: |
        1. Go to '...'
        2. Execute command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 'Expected Behavior'
      description: 'A clear and concise description of what you expected to happen.'
    validations:
      required: true

  - type: textarea
    id: logs-and-errors
    attributes:
      label: 'Relevant Logs and Stack Traces'
      description: 'Paste terminal output, stack traces, or console logs here.'
      render: shell

  - type: dropdown
    id: os
    attributes:
      label: 'Operating System'
      options:
        - 'Linux (Ubuntu / Debian / RHEL / other)'
        - 'macOS (Apple Silicon)'
        - 'macOS (Intel)'
        - 'Windows 11 / 10'
        - 'Docker / Container'
        - 'Other'
    validations:
      required: true

  - type: input
    id: version-info
    attributes:
      label: 'Runtime / Application Version'
      placeholder: 'v1.0.0 (Node.js v22.x / Chrome 120)'
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 'Pre-submission Checklist'
      options:
        - label: 'I have searched existing issues to ensure this is not a duplicate.'
          required: true
        - label: 'I have verified this issue occurs in the latest released version.'
          required: true
